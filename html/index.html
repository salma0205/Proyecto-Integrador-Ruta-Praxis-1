<!DOCTYPE html>
<!-- Indica que el documento esta escrito con HTML5. -->

<html lang="es">
<!-- Abre el documento HTML y define que el idioma principal es espanol. -->

<head>
    <!-- Abre la cabeza del documento, donde se colocan configuraciones y enlaces externos. -->

    <meta charset="UTF-8">
    <!-- Permite usar acentos, enes y caracteres especiales correctamente. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace que la pagina se adapte al ancho de celulares, tablets y computadores. -->

    <title>Ruta Praxis</title>
    <!-- Define el titulo que aparece en la pestana del navegador. -->

    <link rel="stylesheet" href="../css/index.css">
    <!-- Conecta este HTML con su propio archivo de estilos CSS. -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Importa  iconos como usuario, correo y candado. -->
</head>
<!-- Cierra la cabeza del documento. -->

<body>
    <a href="html/index.html">entrar sitio web </a>
    <!-- Abre el cuerpo de la pagina, que contiene todo lo visible. -->

    <main class="pagina-login">
        <!-- Contenedor principal de toda la pantalla de inicio de sesion. -->

        <section class="panel-login">
            <!-- Panel central donde se ubican el titulo y el formulario. -->

            <h1>Bienvenidos a la ruta praxis</h1>
            <!-- Titulo principal de bienvenida. -->

            <form class="formulario-login" id="formulario-login" action="estudiante.html" method="get">
                <!-- Formulario que agrupa los campos de acceso y envia a la pagina del estudiante. -->

                <div class="campo campo-select">
                    <!-- Campo del menu desplegable para seleccionar el rol. -->

                    <i class="fa-solid fa-circle-user"></i>
                    <!-- Icono de usuario ubicado al lado izquierdo del selector. -->

                    <select id="rol-acceso" required>
                        <!-- Menu desplegable obligatorio para escoger un rol. -->

                        <option value="" disabled selected hidden>Selecciona tu rol</option>
                        <!-- Texto inicial del selector; no se puede elegir como opcion real. -->

                        <option value="estudiante">Estudiante</option>
                        <!-- Opcion disponible y funcional por ahora para ingresar como estudiante. -->

                        <option value="administrador">Administrador</option>
                        <!-- Opcion de administrador; por ahora no tiene pagina funcional. -->

                        <option value="docente">Docente</option>
                        <!-- Opcion de docente; por ahora no tiene pagina funcional. -->

                        <option value="asesor">Asesor</option>
                        <!-- Opcion de asesor; por ahora no tiene pagina funcional. -->

                        <option value="director">Director</option>
                        <!-- Opcion de director disponible para el acceso al sistema. -->
                    </select>
                    <!-- Cierra el menu desplegable. -->
                </div>
                <!-- Cierra el campo del selector de rol. -->

                <div class="campo">
                    <!-- Campo para escribir el correo electronico. -->

                    <i class="fa-regular fa-envelope"></i>
                    <!-- Icono de sobre para representar el correo. -->

                    <input type="email" placeholder="Correo electrónico" required>
                    <!-- Entrada obligatoria de tipo email con texto guia para el correo. -->
                </div>
                <!-- Cierra el campo del correo electronico. -->

                <div class="campo">
                    <!-- Campo para escribir la contrasena. -->

                    <i class="fa-solid fa-lock"></i>
                    <!-- Icono de candado para representar seguridad o contrasena. -->

                    <input type="password" placeholder="Contraseña" required>
                    <!-- Entrada obligatoria de tipo password; oculta los caracteres escritos. -->
                </div>
                <!-- Cierra el campo de contrasena. -->

                <div class="opciones-login">
                    <!-- Contenedor para la casilla de recordar y el enlace de recuperar contrasena. -->

                    <label>
                        <!-- Agrupa el checkbox con el texto "Recordarme". -->

                        <input type="checkbox">
                        <!-- Casilla para marcar si se desea recordar el usuario. -->

                        <span>Recordarme</span>
                        <!-- Texto que acompana la casilla de verificacion. -->
                    </label>
                    <!-- Cierra el grupo del checkbox. -->

                    <a href="#">¿Olvidaste tu contraseña?</a>
                    <!-- Enlace visual para recuperar la contrasena. -->
                </div>
                <!-- Cierra las opciones adicionales del login. -->

                <button type="submit">Acceder al sistema</button>
                <!-- Boton que envia el formulario. -->
            </form>
            <!-- Cierra el formulario. -->
        </section>
        <!-- Cierra el panel central del login. -->
    </main>
    <!-- Cierra el contenedor principal de la pagina. -->

    <script src="../js/interacciones.js"></script>
    <script>
        document.getElementById('formulario-login').addEventListener('submit', function (event) {
            var rolSeleccionado = document.getElementById('rol-acceso').value;
            if (rolSeleccionado === 'docente') {
                event.preventDefault();
                window.location.href = 'docente.html';
            }
            if (rolSeleccionado === 'asesor') {
                event.preventDefault();
                window.location.href = 'asesor.html';
            }
            if (rolSeleccionado === 'administrador') {
                event.preventDefault();
                window.location.href = 'administrador.html';
            }
            if (rolSeleccionado === 'director') {
                event.preventDefault();
                window.location.href = 'director.html';
            }
        });
    </script>
</body>
<!-- Cierra el cuerpo del documento. -->

</html>
<!-- Cierra el documento HTML. -->
