<!DOCTYPE html>
<!-- Indica que el documento esta escrito con HTML5. -->

<html lang="es">
<!-- Abre el documento HTML y define que el idioma principal es espanol. -->

<head>
    <!-- Abre la cabeza del documento, donde se colocan configuraciones y enlaces externos. -->

    <meta charset="UTF-8">
    <!-- Permite usar acentos, enes y caracteres especiales correctamente. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace que la pagina se adapte al ancho de celulares, tablets y computadores. -->

    <title>Ruta Praxis</title>
    <!-- Define el titulo que aparece en la pestana del navegador. -->

    <link rel="stylesheet" href="../css/index.css?v=4">
    <!-- Conecta este HTML con su propio archivo de estilos CSS. -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Importa  iconos como usuario, correo y candado. -->
</head>
<!-- Cierra la cabeza del documento. -->

<body>
    <main class="pagina-login">
        <!-- Contenedor principal de toda la pantalla de inicio de sesion. -->

        <section class="panel-login">
            <!-- Panel central donde se ubican el titulo y el formulario. -->

            <h1>Bienvenidos a la ruta praxis</h1>
            <!-- Titulo principal de bienvenida. -->

            <form class="formulario-login" id="formulario-login" autocomplete="off" hidden>
                <!-- Formulario que agrupa los campos de acceso y envia a la pagina del estudiante. -->

                <div class="campo">
                    <i class="fa-solid fa-users-gear"></i>
                    <select id="rol-acceso" aria-label="Selecciona el rol de acceso" required>
                        <option value="">Selecciona tu rol</option>
                        <option value="administrador">Administrador</option>
                        <option value="director">Director</option>
                        <option value="docente">Docente</option>
                        <option value="asesor">Asesor</option>
                        <option value="estudiante">Estudiante</option>
                    </select>
                </div>

                <div class="campo">
                    <!-- Campo para escribir el correo electronico. -->

                    <i class="fa-regular fa-envelope"></i>
                    <!-- Icono de sobre para representar el correo. -->

                    <input id="correo-acceso" type="text" autocomplete="off" placeholder="Usuario o correo electrónico" required>
                    <!-- Identificador de acceso: usuario administrador o correo institucional. -->
                </div>
                <!-- Cierra el campo del correo electronico. -->

                <div class="campo">
                    <!-- Campo para escribir la contrasena. -->

                    <i class="fa-solid fa-lock"></i>
                    <!-- Icono de candado para representar seguridad o contrasena. -->

                    <input id="contrasena-acceso" type="password" autocomplete="off" placeholder="Contraseña" required>
                    <!-- Entrada obligatoria de tipo password; oculta los caracteres escritos. -->
                </div>
                <!-- Cierra el campo de contrasena. -->

                <div class="opciones-login">
                    <!-- Contenedor para la casilla de recordar y el enlace de recuperar contrasena. -->

                    <label>
                        <!-- Agrupa el checkbox con el texto "Recordarme". -->

                        <input type="checkbox">
                        <!-- Casilla para marcar si se desea recordar el usuario. -->

                        <span>Recordarme</span>
                        <!-- Texto que acompana la casilla de verificacion. -->
                    </label>
                    <!-- Cierra el grupo del checkbox. -->

                    <span>Acceso con las credenciales creadas por el administrador.</span>
                    <!-- Enlace visual para recuperar la contrasena. -->
                </div>
                <div class="roles-login" aria-label="Selecciona tu tipo de usuario">
                    <button type="button" data-login-role="administrador">Administrador</button>
                    <button type="button" data-login-role="director">Director</button>
                    <button type="button" data-login-role="docente">Docente</button>
                    <button type="button" data-login-role="asesor">Asesor</button>
                    <button type="button" data-login-role="estudiante">Estudiante</button>
                </div>
                <!-- Cierra las opciones adicionales del login. -->

                <button type="submit">Acceder al sistema</button>
                <!-- Boton que envia el formulario. -->
            </form>
            <p id="mensaje-autenticacion" role="alert" aria-live="polite"></p>
            <section id="configuracion-administrador" hidden>
                <h2>Crear administrador inicial</h2>
                <p>Este formulario solo aparece si todavía no existe un administrador.</p>
                <form class="formulario-login" id="formulario-administrador-inicial" autocomplete="off">
                    <div class="campo"><input name="firstName" type="text" autocomplete="off" placeholder="Nombre" required></div>
                    <div class="campo"><input name="lastName" type="text" autocomplete="off" placeholder="Apellido" required></div>
                    <div class="campo"><input name="username" type="text" autocomplete="off" minlength="3" maxlength="40" pattern="[-A-Za-z0-9._]+" value="admin" placeholder="Nombre de usuario (sin @)" required></div>
                    <div class="campo"><input name="password" type="password" autocomplete="off" minlength="10" placeholder="Contraseña (mínimo 10 caracteres)" required></div>
                    <button type="submit">Crear administrador inicial</button>
                </form>
            </section>
            <!-- Cierra el formulario. -->
        </section>
        <!-- Cierra el panel central del login. -->
    </main>
    <!-- Cierra el contenedor principal de la pagina. -->

    <script src="../js/auth.js?v=5"></script>
    <script src="../js/interacciones.js"></script>
</body>
<!-- Cierra el cuerpo del documento. -->

</html>
<!-- Cierra el documento HTML. -->
